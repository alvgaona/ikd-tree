name: release

run-name: "release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Build conda package
        run: pixi build

      - uses: actions/upload-artifact@v4
        with:
          name: ikd-tree-${{ matrix.platform }}
          path: "**/*.conda"

  prefix-dev:
    name: prefix-dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to prefix.dev
        run: find artifacts -name '*.conda' -print0 | xargs -0 pixi exec rattler-build upload prefix --channel ikd-tree
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_DEV_API_KEY }}

  release:
    name: github-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.conda
          generate_release_notes: true
